/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java application project to get you started.
 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/9.1.0/userguide/building_java_projects.html in the Gradle documentation.
 */
plugins {
    id 'java-library'
    id 'net.nemerosa.versioning' version '2.6.1'
}

version = '2.13.0-nightly'

var username = System.getProperty('user.name')
var timestamp = (() -> new Date().format('yyyyMMdd'))()
var createdBy = "Gradle ${gradle.gradleVersion}"
var buildJdk = "${System.properties['java.version']} (${System.properties['java.vendor']} ${System.properties['java.vm.version']})"
var buildOs = "${System.properties['os.name']} ${System.properties['os.arch']} ${System.properties['os.version']}"

var jarName = project.name
var jarNmeWin64 = "${jarName}-win64.jar"
var jarNameMacos64 = "${jarName}-macos64.jar"
var jarNameMacosAarch64 = "${jarName}-aarch64.jar"
var jarNameLinux64 = "${jarName}-linux64.jar"
var jarNameLinuxArm64 = "${jarName}-linuxarm64.jar"
var jarNameOpenbsd = "${jarName}-openbsd.jar"
// Add additional source sets to defaults
// Could be necessary when changing source/resource locations to java defaults

sourceSets {
    main {
        java {
            srcDirs 'src'
        }
        resources {
            srcDirs 'src'
        }
    }

    test {
        java {
            srcDirs 'test'
        }
    }
}

layout.buildDirectory = 'target'

dependencies {
    // Use JUnit test framework.
    testImplementation 'junit:junit:4.13.2'

    // This dependency is used by the application.
    implementation files('lib/de_willuhn_ds/de_willuhn_ds.jar')
    implementation files('lib/de_willuhn_util/de_willuhn_util.jar')
    implementation 'nebula:org.eclipse.nebula.paperclips.core:2.1.0.202402011804'
    implementation 'nebula:org.eclipse.nebula.paperclips.widgets:2.1.0.202402011804'
    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.72'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.72'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.72'
    implementation 'com.h2database:h2:1.4.199'
    implementation 'commons-cli:commons-cli:1.3.1'
    implementation 'commons-lang:commons-lang:2.6'
    implementation 'commons-collections:commons-collections:3.2.2' // Version 3 brauchen wir noch wegen Velocity.
    implementation 'commons-logging:commons-logging:1.2'
    implementation 'com.mckoi:mckoisqldb:1.0.5'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
    implementation 'be.cyberelf.nanoxml:nanoxml:2.2.3'
    implementation 'org.apache.velocity:velocity:1.7'
    implementation 'oro:oro:2.0.8'
    // Java EE. Ab Java 11 nicht mehr in Java enthalten

    // jakarta.xml.*
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'

    // javax.xml.*
    implementation 'javax.xml.ws:jaxws-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.4.0-b180830.0438'
    implementation 'org.glassfish.main.javaee-api:javax.jws:3.1.2.2'

    // SWT
    implementation 'org.eclipse.platform:org.eclipse.swt.gtk.linux.x86_64:3.131.0'
    implementation 'org.eclipse.platform:org.eclipse.swt.gtk.linux.aarch64:3.131.0'
    implementation 'org.eclipse.platform:org.eclipse.swt.win32.win32.x86_64:3.131.0'
    implementation 'org.eclipse.platform:org.eclipse.swt.cocoa.macosx.x86_64:3.131.0'
    implementation 'org.eclipse.platform:org.eclipse.swt.cocoa.macosx.aarch64:3.131.0'
    implementation 'org.eclipse.platform:org.eclipse.ui.forms:3.8.100'
    implementation 'com.ibm.icu:icu4j:52.1'
    implementation 'org.eclipse.platform:org.eclipse.jface:3.28.0'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

compileJava {
    options.release = 11
    options.encoding = 'ISO-8859-1'
    options.debug = true
    options.debugOptions {
        debugLevel = 'lines,vars,source'
    }
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    manifest {
        attributes (
                'Built-By': username,
                'Built-Date': timestamp,
                'Build-Revision' : versioning.info.commit,
                'Created-By': createdBy,
                'Build-JDK': buildJdk,
                'Build-OS': buildOs,
                'Implementation-Title': project.name,
                'Implementation-Version': version
        )
    }
}

tasks.named('assemble') {
    dependsOn tasks.platformJar
}

tasks.register('platformJar', Jar) {
    group 'build'
    dependsOn tasks.jar
    archiveBaseName = 'test'
    //Project directory
    from './src' //Current directory

    //Gradle generated file storage(build directory)Or
    // .Don't include hidden directories such as gradle in your ZIP file
    excludes = ['build', '.*']
}

